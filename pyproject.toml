[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontogeny"
version = "0.1.0"
description = "Bounded experiments in developmental neural learning"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1"]

[project.scripts]
ontogeny = "ontogeny.cli:main"
ontogeny-exec = "ontogeny.execution.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "kaggle"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
