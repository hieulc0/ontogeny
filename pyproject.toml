[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontogeny"
version = "0.1.0"
description = "Bounded experiments in developmental neural learning"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
neural = ["torch==2.6.0", "numpy==2.1.3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1"]

[project.scripts]
ontogeny = "ontogeny.cli:main"
ontogeny-exec = "ontogeny.execution.cli:main"
mini-gpt-train = "mini_gpt.cli:main"
mini-gpt-import = "mini_gpt.cli:import_checkpoint"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_gpt", "src/ontogeny"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["remote: requires verified remote CUDA; never run neural checks locally"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "kaggle"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
